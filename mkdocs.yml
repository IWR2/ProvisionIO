site_name: ProvisionIO API Documentation
site_url: https://ProvisionIO.example
theme:
  name: material
  font:
    text: Merriweather Sans
    code: Red Hat Mono
  icon:
    logo: fontawesome/solid/p
  features:
    - navigation.footer
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: deep purple

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: blue
      accent: deep orange


markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details

nav:
  - Overview: index.md
  - Data Models:
      - Overview: model.md
      - User: model/user.md
      - Clients: model/clients.md
      - Services: model/services.md
  - API Reference:
      - API Directory: api/endpoints.md
      - Admin Endpoints: api/admin.md
      - Client Management: api/clients.md
      - Service Management: api/services.md
      - Other Endpoints: api/other.md
  - Guides:
      - Global Behaviors: guides/behaviors.md
      - Authentication: guides/authentication.md
  - MkDocs Examples:
      - Admonitions: admonitions.md
      - Code Examples: code-examples.md
      - Content Tabs: content-tabs.md
      - Diagram Examples: diagram-examples.md

extra:
  social:
    - icon: octicons/logo-github-24
      link: github.com/IWR2

copyright: Copyright &copy; 2026 IWR2